services:
  dex-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "dex"
      nucleus.depends: "mongo"
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
      PORT: 3013
    volumes:
      - ./server:/app
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      - dex_server_modules:/app/node_modules
      - dex_uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3013/api/dex/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dex-client:
    build:
      context: ./client
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-client"
      nucleus.app: "dex"
    environment:
      # virtiofs emits no inotify events, so Vite must poll.
      CHOKIDAR_USEPOLLING: "true"
      API_TARGET: http://dex-server:3013
      NUCLEUS_HOST: ${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      # Mounted at the client/locales symlink's resolved target, which is outside the build context.
      - ./locales:/locales:ro
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      - ../../widgets:/app/widgets:ro
    depends_on:
      dex-server:
        condition: service_healthy

volumes:
  dex_server_modules:
  dex_uploads_data:
